type Query {
  place(placeId: ID!): Place!
  currentUser: User
  places(limit: Int, offset: Int = 0): PlacesResponse!
  filteredPlaces(neighborhood: [String], minRating: Float, additionalInfo: [String]): PlacesResponse!
  neighborhoodShortlists(neighborhood: String!): [Shortlist!]!
  favoritePlaces: [FavoritePlace!]!
  placeReviews(placeId: ID!): PlaceReviews!
  userReviewActivity: [UserReviewActivity!]!
  availableAdditionalInfoTags: AdditionalInfoTagsResponse!
  availableNeighborhoods: AvailableNeighborhoodsResponse!
  """
  Opens a Place suggestion from the admin's review link. The token is the only
  authorization; a wrong token and an unknown id fail the same way.
  """
  placeSuggestionForReview(id: ID!, token: String!): PlaceSuggestionForReview!
  """
  Up to three Google Place ID candidates for a suggestion, free ("IDs Only"
  Text Search). A bad token fails like every other admin operation.
  """
  findGoogleIdsForSuggestion(id: ID!, token: String!): [GoogleIdCandidate!]!
}

type AdditionalInfoTagsResponse {
  tags: [String!]!
}

type AvailableNeighborhoodsResponse {
  neighborhoods: [String!]!
  total: Int!
}

type Mutation {
  # Authentication Mutations
  loginWithGoogle(code: String!): AuthPayload
  signInWithEmail(email: String!, password: String!): AuthPayload!
  registerUser(
    email: String!
    displayName: String!
    password: String!
    # Nullable only so the previous frontend build keeps validating during the
    # rollout; the resolver requires it. Make it String! once the new frontend
    # is live.
    captchaToken: String
  ): SuccessResponse!
  resendConfirmationEmail(email: String!): SuccessResponse!
  confirmEmail(token: String!, email: String!): AuthPayload!
  requestPasswordReset(email: String!): SuccessResponse!
  validatePasswordResetToken(email: String!, token: String!): SuccessResponse!
  resetPassword(
    token: String!
    email: String!
    newPassword: String!
  ): SuccessResponse!
  logout: LogoutResponse
  refreshToken: RefreshTokenResponse!

  # User Profile Mutations
  updatePersonalData(
    userId: ID!
    displayName: String
    email: String
  ): SuccessResponse!
  setNewPassword(
    userId: ID!
    oldPassword: String
    newPassword: String!
  ): SuccessResponse!
  uploadAvatar(
    userId: ID!
    fileBuffer: String!
    fileName: String!
  ): UploadAvatarResponse!
  deleteAvatar: SuccessResponse!
  deleteAccount: SuccessResponse!

  # Guest Mutations
  """
  Issues a guest identity after a captcha check. This is the only place a guest
  captcha is verified; every later guest action authenticates with the secret.
  """
  createGuestIdentity(captchaToken: String): GuestIdentityPayload!
  """Attaches reviews left as a guest to the currently signed-in account."""
  claimGuestReviews(
    guestId: String!
    guestSecret: String!
  ): ClaimGuestReviewsResponse!

  # Place and Review Mutations
  # guestId/guestSecret are used only when there is no signed-in user.
  addRating(
    placeId: ID!
    rating: Float!
    guestId: String
    guestSecret: String
  ): AddRatingResponse!
  addTextReview(
    placeId: ID!
    text: String!
    guestId: String
    guestSecret: String
  ): AddTextReviewResponse!
  uploadReviewImage(
    reviewId: ID!
    fileBuffer: String!
    guestId: String
    guestSecret: String
  ): UploadReviewImageResponse!
  toggleFavorite(placeId: ID!): Boolean!
  deleteReview(reviewId: ID!, deleteOptions: String!): DeleteReviewResult!
  toggleCharacteristic(
    placeId: ID!
    characteristic: Characteristic!
    guestId: String
    guestSecret: String
  ): SuccessResponse!

  # Place suggestions
  # guestId/guestSecret are used only when there is no signed-in user.
  """Returns the id of the new suggestion."""
  submitPlaceSuggestion(
    input: PlaceSuggestionInput!
    guestId: String
    guestSecret: String
  ): ID!
  """
  Attaches one photo to a Place suggestion. Only the suggester, only while
  `pending`, at most 10; Guests count towards the existing Guest photo limit.
  Returns the new photo count.
  """
  uploadPlaceSuggestionPhoto(
    suggestionId: ID!
    fileBuffer: String!
    guestId: String
    guestSecret: String
  ): UploadPlaceSuggestionPhotoResponse!
  """
  Attaches one photo to a Place suggestion as the admin, authorized only by
  the review link's token (ADR 0002 in the frontend repo) rather than
  ownership. Same rules as uploadPlaceSuggestionPhoto (pending only, the same
  shared 10-photo cap) but no rate limit. Returns the new photo's own path.
  """
  uploadPlaceSuggestionPhotoAsAdmin(
    id: ID!
    token: String!
    fileBuffer: String!
  ): String!
  """
  Deletes one photo of a Place suggestion, the suggester's or the admin's,
  authorized only by the review link's token. The path must sit in this
  suggestion's own ImageKit folder; a path already gone still succeeds, so a
  retried delete is safe.
  """
  deletePlaceSuggestionPhoto(id: ID!, token: String!, path: String!): Boolean!
  """
  Publishes a Place suggestion as a new Place and emails the suggester. A
  repeat call changes nothing and returns the outcome already decided; a bad
  token fails like every admin operation (ADR 0002 in the frontend repo).
  """
  publishPlaceSuggestion(
    id: ID!
    token: String!
    input: PublishPlaceSuggestionInput!
  ): PlaceSuggestionOutcome!
  """Rejects a Place suggestion. A repeat call changes nothing."""
  rejectPlaceSuggestion(id: ID!, token: String!): PlaceSuggestionOutcome!

  # Contact Form Mutation
  contactForm(
    name: String!
    email: String!
    message: String!
    captchaToken: String
  ): ContactFormResponse!

  # Report Inaccuracy Mutation
  reportInaccuracy(
    placeId: String!
    placeName: String!
    message: String!
    captchaToken: String
  ): ReportInaccuracyResponse!
}

