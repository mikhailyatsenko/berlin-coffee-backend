type Place {
  id: ID! 
  type: String!
  geometry: Geometry!
  properties: PlaceProperties!
}

type PlacesResponse {
  places: [Place!]!
  total: Int!
}

enum ShortlistId {
  work
  dogFriendly
  outdoorSeating
  breakfastBrunch
}

type Shortlist {
  id: ShortlistId!
  "Canonical Amenity names, for the map's Filters."
  amenities: [String!]!
  "Top 5 by Average rating."
  places: [Place!]!
  "All Places that qualify."
  total: Int!
}

type FavoritePlace {
  id: ID!
  name: String!
  address: String!
  image: String!
  instagram: String!
  averageRating: Float
  isFavorite: Boolean!
  neighborhood: String
  googleId: String
}

type FavoritePlacesResponse {
  places: [FavoritePlace!]!
  total: Int!
}

type Geometry {
  type: String!
  coordinates: [Float!]!
}

type PlaceProperties {
  id: ID!
  name: String!
  description: String!
  address: String!
  image: String!
  images: [String!]
  instagram: String!
  averageRating: Float
  ratingCount: Int!
  favoriteCount: Int!
  isFavorite: Boolean!
  "The caller's own Rating (User or Guest). Filled by filteredPlaces and neighborhoodShortlists only, null elsewhere."
  ownRating: Int
  "The Characteristics the caller marked in their own Review. Filled by filteredPlaces and neighborhoodShortlists only, null elsewhere."
  ownCharacteristics: [Characteristic!]
  reviews: [Review!]!
  characteristicCounts: CharacteristicCounts!
  additionalInfo: JSON
  googleId: String
  neighborhood: String
  openingHours: [OpeningHour!]
  phone: String
  website: String
}

type PlaceReviews {
  id: ID!
  reviews: [Review!]!
} 


type OpeningHour {
  day: String!
  hours: String!
} 