name: Deploy Coffemap Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The same checks as a pull request (ci.yml); a failure stops the deploy.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # One deploy on the server at a time: a newer push that passes CI while an
    # older deploy runs waits for it instead of switching `current` under it.
    # On the job, not the workflow, so it cannot collide with ci.yml's group.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (for build only)
        run: npm ci
        timeout-minutes: 5

      - name: Build project
        run: npm run build
        timeout-minutes: 5

      - name: Prepare deployment package
        run: |
          mkdir upload
          tar -czf upload/deploy.tar.gz dist package.json package-lock.json
          cp deploy/release.sh upload/
        timeout-minutes: 2

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "upload/deploy.tar.gz,upload/release.sh"
          target: "/var/www/coffee-server/incoming"
          strip_components: 1
          timeout: 300s

      # Installs into releases/<sha>, switches `current`, restarts PM2,
      # health-checks and rolls back on failure; see deploy/release.sh.
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            bash /var/www/coffee-server/incoming/release.sh "${{ github.sha }}" /var/www/coffee-server/incoming/deploy.tar.gz
          timeout: 600s
